[project]
name = "news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
]

[project.scripts]
news = "news.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
